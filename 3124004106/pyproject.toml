[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = [
    "E501",  # 行长由 format 统一处理
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # 测试里 conftest 改 sys.path 后再 import

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
